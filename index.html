<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diorama Sensori: Padanan Ganda</title>
    <style>
        /* Palet warna pastel untuk murid inklusif */
        body { 
            background-color: #f0f8ff; /* Biru Alice yang menenangkan */
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; /* Font mesra kanak-kanak/disleksia */
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; padding: 20px; color: #2d3436;
        }
        h1 { color: #6c5ce7; text-align: center; font-size: 28px; }
        p.instruction { font-size: 18px; color: #636e72; margin-bottom: 30px; text-align: center; }
        
        .game-board {
            display: flex; justify-content: center; gap: 40px; width: 100%; max-width: 600px;
        }
        .column {
            display: flex; flex-direction: column; gap: 15px; width: 45%;
        }
        .word-btn {
            background-color: #fff; border: 3px solid #74b9ff; border-radius: 15px;
            padding: 15px; font-size: 20px; font-weight: bold; color: #0984e3;
            cursor: pointer; text-align: center; transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); user-select: none;
        }
        .word-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(116, 185, 255, 0.3); }
        
        /* State Warna */
        .selected-left { background-color: #ffeaa7; border-color: #fdcb6e; color: #d35400; }
        .selected-right { background-color: #ffeaa7; border-color: #fdcb6e; color: #d35400; }
        .correct { background-color: #55efc4 !important; border-color: #00b894 !important; color: #2d3436 !important; transform: scale(1.05); cursor: default; }
        .wrong-shake { animation: shake 0.4s; background-color: #fab1a0; border-color: #e17055; color: white; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        #feedback-area {
            margin-top: 40px; min-height: 80px; text-align: center;
        }
